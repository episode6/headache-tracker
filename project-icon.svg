<?xml version="1.0" encoding="UTF-8"?>
<!--
SVG rendition of the app's adaptive launcher icon (ic_launcher_background +
ic_launcher_foreground), cropped to the icon's visible 72dp region and drawn
as a rounded square. Used by Collins as this project's sidebar icon.
-->
<svg width="128" height="128" viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect x="18" y="18" width="72" height="72" rx="16" fill="#6200EE"/>

  <!-- foreground: same 0.8x safe-zone transform as ic_launcher_foreground.xml
       (translateY -2, then scale 0.8 about pivot 54,56) -->
  <g transform="translate(54,54) scale(0.8) translate(-54,-56)">
    <!-- calendar body -->
    <path fill="#FFFFFF" d="M28,32 L80,32 C82.2,32 84,33.8 84,36 L84,76 C84,78.2 82.2,80 80,80 L28,80 C25.8,80 24,78.2 24,76 L24,36 C24,33.8 25.8,32 28,32 Z"/>

    <!-- calendar header -->
    <path fill="#FF5252" d="M28,32 L80,32 C82.2,32 84,33.8 84,36 L84,44 L24,44 L24,36 C24,33.8 25.8,32 28,32 Z"/>

    <!-- intensity dots -->
    <circle cx="37" cy="54" r="3" fill="#FFD740"/>
    <circle cx="47" cy="54" r="3" fill="#FF5252"/>
    <circle cx="57" cy="54" r="3" fill="#69F0AE"/>
    <circle cx="67" cy="54" r="3" fill="#FF5252"/>
    <circle cx="77" cy="54" r="3" fill="#FFD740"/>

    <circle cx="37" cy="68" r="3" fill="#69F0AE"/>
    <circle cx="47" cy="68" r="3" fill="#FFD740"/>
    <circle cx="57" cy="68" r="3" fill="#FF5252"/>
    <circle cx="67" cy="68" r="3" fill="#69F0AE"/>
    <circle cx="77" cy="68" r="3" fill="#FFD740"/>
  </g>
</svg>
